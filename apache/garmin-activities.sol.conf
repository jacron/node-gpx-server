<VirtualHost *:80>
    ServerName garmin-activities.sol
    ProxyPreserveHost On

    # Zelfde opzet als garmin-activities.conf (ios): WebSocket-upgrades naar ws://, de rest naar
    # http:// op dezelfde poort. Op sol in /private/etc/apache2/vhosts/garmin-activities.conf.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) ws://localhost:3016/$1 [P,L]

    ProxyPass / http://localhost:3016/
    ProxyPassReverse / http://localhost:3016/
</VirtualHost>
