<VirtualHost *:80>
    ServerName garmin-activities.ios
    ProxyPreserveHost On

    # node-gpx-server draait ws (raw WebSocket, geen socket.io) rechtstreeks op dezelfde poort
    # als de HTTP-server (app/lib/socket.js: new WebSocket.Server({server})) — geen apart pad,
    # dus hier op basis van de Upgrade-header naar ws:// doorzetten i.p.v. http://.
    # Vereist mod_proxy_wstunnel (naast proxy_module/proxy_http_module/rewrite_module, die al
    # aanstaan gezien de bestaande movies20-vhost).
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) ws://localhost:3016/$1 [P,L]

    ProxyPass / http://localhost:3016/
    ProxyPassReverse / http://localhost:3016/
</VirtualHost>
